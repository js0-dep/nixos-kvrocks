name: 自动更新与发布

permissions: write-all

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # 每天凌晨 1:01 (UTC) 检查上游更新
    - cron: "1 1 * * *"

jobs:
  auto-update:
    runs-on: ubuntu-latest
    name: 检查更新并构建发布
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - uses: oven-sh/setup-bun@v2

      - name: 执行自动更新脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -ex
          cd action
          bun i
          git config --global user.email "action@github.com"
          git config --global user.name "${{ github.repository_owner }}"
          ./auto_update.js

          # 检查是否有新的本地提交（表示有版本更新）
          if [ $(git rev-list --count origin/main..HEAD) -gt 0 ]; then
            echo "UPDATED=true" >> $GITHUB_ENV
          else
            echo "UPDATED=false" >> $GITHUB_ENV
          fi

      - name: 验证 Nix 构建
        if: env.UPDATED == 'true'
        run: |
          set -ex
          nix flake check
          nix build .#default --print-build-logs

      - name: 推送 main 分支
        if: env.UPDATED == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: 创建 Git Tag 与 GitHub Release
        if: env.UPDATED == 'true' && env.RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          git tag "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "kvrocks ${{ env.RELEASE_TAG }}" \
            --notes "Automated release tracking upstream Apache Kvrocks [${{ env.RELEASE_TAG }}](https://github.com/apache/kvrocks/releases/tag/${{ env.RELEASE_TAG }})."
