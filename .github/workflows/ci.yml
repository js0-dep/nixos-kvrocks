name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".date"
      - "README.md"
      - "readme/**"
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    name: Flake 检查与构建
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: 检查 Flake 语法与求值
        run: |
          nix flake check

      - name: 构建默认包
        run: |
          nix build .#default --print-build-logs
